<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos de lista</title>
</head>
<body>
    <h1>Elementos de lista</h1>
    <p>
        As listas em HTML são utilizadas para organizar informações
        em uma sequência. 
    </p>
    <h2>listas Ordenadas</h2>
    <ol>
        <li>Primeiro Item</li>
        <li>Segundo Item</li>
        <li>Terceiro Item</li>
    </ol>
    <h2>Listas Não ordenadas</h2>
    <ul>
        <li>Primeiro Item</li>
        <li>Segundo Item</li>
        <li>Terceiro Item</li>
    </ul>
</body>
</html>
