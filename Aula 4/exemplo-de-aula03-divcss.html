<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo div com css</title>

    <style>
        div {
            font-size: 28px;
            text-align: center;
            padding: 20px;
            margin: 20px;
            border: 10px;
        }
        #Principal {
            background-color: rgb(8, 8, 8);
            border: 4px solid rgb(231, 5, 5);
            color: rgb(255, 255, 255);
        }
        #Secundaria {
            background-color: rgb(3, 3, 3);
            border: 4px solid red;
            color: rgb(252, 251, 251);
        }
        hr {
            Border: none;
            border-top: 3px solid gray;
            width: 80%;
        }


    </style>

</head>
<body>
    <div id="Principal">
        Esta é a primeira linha.
        <br>
        Esta é a segunda linha.
    </div>
    <hr/>
    <div id="Secundaria">
        Esta é outra divisão da página.
        <br>
        Aqui começa uma nova linha.
    </div>
</body>
</html>
