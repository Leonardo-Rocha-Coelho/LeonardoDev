<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Tabelas</title>
</head>
<body>
   <h1>Tabelas em HTML</h1> 
   <p>
    As tabelas em HTML são usadas para <br>
    organizar dados em linha e colunas.
   </p>

   <table border="2">           

    <thead> 
        <tr>
            <th>Nome</th>
            <th>Idade</th> 
            <th>Cidade</th>               
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>Leonardo</td>
            <td>19</td>
            <td>São Paulo</td>
        </tr>
        <tr>
            <td>Bermardo</td>
            <td>19</td>
            <td>Curitiba</td>
        </tr>
        <tr>
            <td>Gabriel</td>
            <td>18</td> 
            <td>Rio de Janeiro</td>
        </tr>
    </tbody>
   </table>
</body>
</html>



td (dados) - thead (cabeçalho) - th ()
